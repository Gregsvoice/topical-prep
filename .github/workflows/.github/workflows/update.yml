
name: Refresh Topical Prep

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check UK update time
        id: clock
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          if [[ "$HOUR" == "08" || "$HOUR" == "12" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update news
        if: steps.clock.outputs.refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: python update.py

      - name: Publish news
        if: steps.clock.outputs.refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update Topical Prep news" && git push)
